apiVersion: v1
kind: Service
metadata:
  name: {{ include "tools.fullname" . }}
  labels:
    {{- include "tools.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "tools.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: http
  ports:
    - {name: http, port: {{ .Values.service.port }}, targetPort: http, protocol: TCP}
