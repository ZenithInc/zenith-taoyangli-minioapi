image:
  repository: registry.taoyangli.cn/taoyangli/tools
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: harbor-pull
runtimeSecretName: ""
replicaCount: 2
revisionHistoryLimit: 3
terminationGracePeriodSeconds: 60

service:
  port: 8080

ingress:
  enabled: true
  className: traefik
  host: tools.internal.taoyangli
  publicPrefix: /tool

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

probes:
  startup: {periodSeconds: 2, timeoutSeconds: 2, failureThreshold: 30}
  readiness: {periodSeconds: 10, timeoutSeconds: 2, failureThreshold: 3}
  liveness: {periodSeconds: 20, timeoutSeconds: 2, failureThreshold: 3}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile: {type: RuntimeDefault}

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
