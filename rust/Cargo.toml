[package]
name = "taoyangli-tools"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
async-trait = "0.1"
aws-credential-types = "1"
aws-sdk-s3 = "1"
aws-types = "1"
axum = { version = "0.8", features = ["json", "macros", "multipart"] }
bytes = "1"
futures-core = "0.3"
md5 = "0.8"
php_serde = "0.6"
rand = "0.9"
redis = { version = "0.32", features = ["connection-manager", "tokio-comp"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
